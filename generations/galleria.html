<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generazioni</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --brand-red: #a61316;
    --brand-black: #171717;
    --brand-white: #f5f3ee;
    --bg: #0e0e0e;
    --tile: #1b1b1b;
    --muted: #8d8a84;
    --gap: 14px;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--brand-white); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 34px clamp(16px, 3vw, 40px) 22px;
  }
  h1 {
    margin: 0; font-size: clamp(28px, 4vw, 52px); font-weight: 800;
    letter-spacing: -0.035em; line-height: 0.95;
  }
  h1 span { color: var(--brand-red); }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .wall {
    padding: 0 clamp(16px, 3vw, 40px) 48px;
    display: flex; gap: var(--gap); align-items: flex-start;
  }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }

  .tile {
    display: block; width: 100%;
    position: relative; overflow: hidden; border-radius: var(--radius);
    background: var(--tile); cursor: zoom-in; border: 0; padding: 0;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease, box-shadow .25s ease;
  }
  .tile.in { opacity: 1; transform: none; }
  .tile:hover { box-shadow: 0 0 0 1px rgba(245,243,238,.18), 0 18px 40px -18px rgba(0,0,0,.9); }
  .tile:focus-visible { outline: 2px solid var(--brand-red); outline-offset: 3px; }
  .tile img, .tile video { display: block; width: 100%; height: auto; }
  .tile .badge {
    position: absolute; top: 10px; left: 10px; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 700; padding: 4px 7px; border-radius: 6px;
    background: rgba(14,14,14,.72); backdrop-filter: blur(6px); color: var(--brand-white);
    pointer-events: none;
  }
  .tile .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-red); margin-right: 6px; vertical-align: 1px; }

  .empty {
    margin: 10vh auto; max-width: 520px; padding: 0 16px; color: var(--muted); line-height: 1.6;
  }
  .empty strong { color: var(--brand-white); display: block; font-size: 20px; margin-bottom: 6px; }
  .empty code { color: var(--brand-white); background: var(--tile); padding: 2px 6px; border-radius: 5px; font-size: 13px; }

  dialog {
    border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh;
    width: 100vw; height: 100vh; color: var(--brand-white);
  }
  dialog::backdrop { background: rgba(8,8,8,.9); backdrop-filter: blur(8px); }
  dialog[open] { display: flex; align-items: center; justify-content: center; }
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    max-width: min(92vw, 1400px); animation: pop .22s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .stage img, .stage video {
    max-width: min(92vw, 1400px); max-height: 82vh; border-radius: var(--radius);
    display: block; background: var(--tile);
  }
  .caption {
    max-width: min(92vw, 900px); font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center;
  }
  .caption b { color: var(--brand-white); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .tile, .stage { transition: none; animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Generazioni<span>.</span></h1>
  <div class="count" id="count"></div>
</header>
<main class="wall" id="wall"></main>
<dialog id="box" aria-label="Anteprima"><div class="stage" id="stage"></div></dialog>

<script src="manifest.js"></script>
<script>
(function () {
  var voci = Array.isArray(window.GENERAZIONI) ? window.GENERAZIONI : [];
  var wall = document.getElementById("wall");
  var box = document.getElementById("box");
  var stage = document.getElementById("stage");
  document.getElementById("count").textContent = voci.length ? voci.length + (voci.length === 1 ? " file" : " file") : "";

  if (!voci.length) {
    wall.outerHTML = '<div class="empty"><strong>Ancora niente qui.</strong>' +
      'Ogni immagine o video creato con <code>/generate</code> compare qui da solo, il più recente in alto.</div>';
    return;
  }

  var vede = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); vede.unobserve(e.target); } });
  }, { rootMargin: "80px" }) : null;

  var tiles = voci.map(function (v) {
    var t = document.createElement("button");
    t.className = "tile";
    t.type = "button";
    t.setAttribute("aria-label", (v.tipo === "video" ? "Video: " : "Immagine: ") + v.file);
    var m;
    if (v.tipo === "video") {
      m = document.createElement("video");
      m.src = v.file; m.muted = true; m.loop = true; m.playsInline = true; m.preload = "metadata";
      t.addEventListener("mouseenter", function () { var p = m.play(); if (p) p.catch(function () {}); });
      t.addEventListener("mouseleave", function () { m.pause(); m.currentTime = 0; });
      var b = document.createElement("span"); b.className = "badge"; b.textContent = "video"; t.appendChild(b);
    } else {
      m = document.createElement("img");
      m.src = v.file; m.alt = v.prompt || v.file; m.loading = "lazy"; m.decoding = "async";
    }
    if (v.larghezza && v.altezza) { m.width = v.larghezza; m.height = v.altezza; }
    t.insertBefore(m, t.firstChild);
    t.addEventListener("click", function () { apri(v); });
    if (vede) vede.observe(t); else t.classList.add("in");
    return t;
  });

  // Il piu recente in alto: le tessere scorrono riga per riga, da sinistra a destra.
  var ncol = 0;
  function colonne() { var w = window.innerWidth; return w <= 480 ? 1 : w <= 820 ? 2 : w <= 1200 ? 3 : 4; }
  function disponi() {
    var n = colonne(); if (n === ncol) return; ncol = n;
    wall.innerHTML = "";
    var cols = [];
    for (var i = 0; i < n; i++) { var c = document.createElement("div"); c.className = "col"; wall.appendChild(c); cols.push(c); }
    tiles.forEach(function (t, i) { cols[i % n].appendChild(t); });
  }
  disponi();
  window.addEventListener("resize", disponi);

  function apri(v) {
    stage.innerHTML = "";
    var m;
    if (v.tipo === "video") {
      m = document.createElement("video");
      m.src = v.file; m.controls = true; m.autoplay = true; m.loop = true; m.playsInline = true;
    } else {
      m = document.createElement("img"); m.src = v.file; m.alt = v.prompt || v.file;
    }
    stage.appendChild(m);
    var c = document.createElement("div"); c.className = "caption";
    var parti = [];
    if (v.modello) parti.push("<b>" + esc(v.modello) + "</b>" + (v.provider ? " · " + esc(v.provider) : ""));
    if (v.creato) parti.push(new Date(v.creato).toLocaleString("it-IT", { dateStyle: "medium", timeStyle: "short" }));
    c.innerHTML = parti.join(" · ") + (v.prompt ? "<br>" + esc(v.prompt) : "");
    stage.appendChild(c);
    box.showModal();
  }
  function chiudi() { var vid = stage.querySelector("video"); if (vid) vid.pause(); box.close(); }
  box.addEventListener("click", function (e) { if (!e.target.closest("img, video, .caption")) chiudi(); });
  box.addEventListener("cancel", function () { var vid = stage.querySelector("video"); if (vid) vid.pause(); });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }
})();
</script>
</body>
</html>
